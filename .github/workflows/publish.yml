name: Publish AUR packages

on:
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]
  workflow_dispatch:
    inputs:
      releaseTag:
        description: Release tag to publish (for example, v0.36.0-beta or v0.36.0-nightly-2111)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: aur-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish opentubex packages
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install tools
        run: pacman --sync --refresh --sysupgrade --noconfirm git github-cli openssh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.client_payload.tag || inputs.releaseTag }}
          EVENT_TYPE: ${{ github.event.action }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"

          if [[ -z "$tag" ]]; then
            if [[ "$EVENT_TYPE" == 'opentubex-nightly' ]]; then
              echo 'A nightly dispatch must include a release tag.' >&2
              exit 1
            fi
            tag="$(gh release view --repo OpenTubeX/OpenTubeX --json tagName --jq .tagName)"
          fi

          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-nightly-([0-9]+)$ ]]; then
            version="${tag#v}"
            pkgver="${BASH_REMATCH[1]}.nightly.${BASH_REMATCH[2]}"
            asset_version="$version"
            packages='opentubex-nightly-bin'
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta$ ]]; then
            version="${BASH_REMATCH[1]}"
            pkgver="$version"
            asset_version="${version}_beta"
            packages='opentubex-bin opentubex opentubex-nightly-bin opentubex-git'
          else
            echo "Expected a beta or nightly release tag, got: $tag" >&2
            exit 1
          fi

          if [[ ( "$EVENT_TYPE" == 'opentubex-nightly' && "$packages" != 'opentubex-nightly-bin' ) ||
                ( "$EVENT_TYPE" == 'opentubex-release' && "$packages" == 'opentubex-nightly-bin' ) ]]; then
            echo "Release tag $tag does not match dispatch type $EVENT_TYPE" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "pkgver=$pkgver"
            echo "asset_version=$asset_version"
            echo "packages=$packages"
          } >> "$GITHUB_OUTPUT"

      - name: Download release files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ASSET_VERSION: ${{ steps.release.outputs.asset_version }}
          PACKAGES: ${{ steps.release.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          gh release download "$RELEASE_TAG" \
            --repo OpenTubeX/OpenTubeX \
            --dir release-files \
            --pattern "opentubex_${ASSET_VERSION}_amd64.deb" \
            --pattern "opentubex_${ASSET_VERSION}_arm64.deb"
          if [[ " $PACKAGES " == *' opentubex '* ]]; then
            gh release download "$RELEASE_TAG" \
              --repo OpenTubeX/OpenTubeX \
              --archive tar.gz \
              --output release-files/source.tar.gz
          fi

      - name: Update package metadata
        env:
          PKGVER: ${{ steps.release.outputs.pkgver }}
          ASSET_VERSION: ${{ steps.release.outputs.asset_version }}
          PACKAGES: ${{ steps.release.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          amd64_checksum="$(sha256sum "release-files/opentubex_${ASSET_VERSION}_amd64.deb" | cut -d ' ' -f 1)"
          arm64_checksum="$(sha256sum "release-files/opentubex_${ASSET_VERSION}_arm64.deb" | cut -d ' ' -f 1)"
          read -r -a packages <<< "$PACKAGES"
          if [[ " $PACKAGES " == *' opentubex-bin '* ]]; then
            # The deb carries the release notes that the OpenTubeX release build recorded.
            bsdtar -xOf "release-files/opentubex_${ASSET_VERSION}_amd64.deb" 'data.tar.*' \
              | bsdtar -xOf - ./usr/share/doc/opentubex/changelog.gz \
              | gzip -dc > release-files/opentubex.changelog
          fi

          for package in "${packages[@]}"; do
            if [[ "$package" == 'opentubex' || "$package" == 'opentubex-bin' ]]; then
              cp release-files/opentubex.changelog "$package/opentubex.changelog"
            fi

            # The VCS recipe keeps its Git-derived version and local file checksums.
            if [[ "$package" == 'opentubex-git' ]]; then
              continue
            fi
            if ! grep -qxF "pkgver=${PKGVER}" "$package/PKGBUILD"; then
              sed -i -E "s/^pkgrel=.*/pkgrel=1/" "$package/PKGBUILD"
            fi
            sed -i -E "s/^pkgver=.*/pkgver=${PKGVER}/" "$package/PKGBUILD"
            if [[ "$package" == 'opentubex' ]]; then
              source_checksum="$(sha256sum release-files/source.tar.gz | cut -d ' ' -f 1)"
              sed -i -E "0,/^sha256sums=\('[^']*'/s//sha256sums=('${source_checksum}'/" "$package/PKGBUILD"
            else
              sed -i -E "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${amd64_checksum}')/" "$package/PKGBUILD"
              sed -i -E "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${arm64_checksum}')/" "$package/PKGBUILD"
            fi
          done

          useradd --create-home builder
          chown -R builder:builder "${packages[@]}"
          for package in "${packages[@]}"; do
            runuser -u builder -- bash -c "cd '$GITHUB_WORKSPACE/$package' && makepkg --printsrcinfo" \
              > "$package/.SRCINFO"
          done
          chown -R root:root "${packages[@]}"

      - name: Commit package metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PACKAGES: ${{ steps.release.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          read -r -a packages <<< "$PACKAGES"
          for package in "${packages[@]}"; do
            git add "$package/PKGBUILD" "$package/.SRCINFO"
            if [[ -f "$package/opentubex.changelog" ]]; then
              git add "$package/opentubex.changelog"
            fi
          done

          if git diff --cached --quiet; then
            echo "Package metadata already up to date for ${RELEASE_TAG}"
          else
            git diff --cached --check
            git commit --no-verify -m "chore: update AUR packages for ${RELEASE_TAG}"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Configure AUR access
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo 'The AUR_SSH_PRIVATE_KEY secret is not configured.' >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          git config --global core.sshCommand \
            "ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"
          git config --global user.name 'OpenTubeX Release Bot'
          git config --global user.email 'actions@github.com'

      - name: Publish packages
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PACKAGES: ${{ steps.release.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir aur-packages

          retry_aur_git() {
            local attempt status
            for attempt in 1 2 3; do
              if git "$@"; then
                return 0
              else
                status=$?
              fi
              if (( attempt < 3 )); then
                echo "AUR Git attempt $attempt/3 failed; retrying in 10 seconds..." >&2
                sleep 10
              fi
            done
            return "$status"
          }

          read -r -a packages <<< "$PACKAGES"
          for package in "${packages[@]}"; do
            retry_aur_git clone "ssh://aur@aur.archlinux.org/${package}.git" "aur-packages/$package"
            git -C "aur-packages/$package" checkout -B master
            git -C "aur-packages/$package" rm -r --ignore-unmatch .
            cp -a "$package/." "aur-packages/$package/"
            git -C "aur-packages/$package" add --all

            if git -C "aur-packages/$package" diff --cached --quiet; then
              echo "$package is already at ${VERSION}"
              continue
            fi

            git -C "aur-packages/$package" diff --cached --check
            git log -1 --format=%B | git -C "aur-packages/$package" commit --file=-
            retry_aur_git -C "aur-packages/$package" push origin master
          done
