name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test recipes and publishing
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install tools
        run: pacman --sync --refresh --sysupgrade --noconfirm python

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # makepkg refuses to run as root.
      - name: Run tests
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- python -I tests/publish.py
          runuser -u builder -- bash tests/package.sh
          runuser -u builder -- bash tests/build.sh
